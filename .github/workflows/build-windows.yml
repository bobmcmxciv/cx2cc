name: Build Windows EXE

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Run tests
        run: python -m pytest

      - name: Compile check
        run: python -m compileall server.py translator.py start-cx2cc.py

      - name: Build EXE
        run: python -m PyInstaller --clean --onefile --name cx2cc --windowed start-cx2cc.py

      - name: Assemble release
        shell: pwsh
        run: |
          $ReleaseName = "cx2cc-windows-x64"
          $ReleaseDir = "dist\$ReleaseName"
          New-Item -ItemType Directory -Force -Path $ReleaseDir | Out-Null
          New-Item -ItemType Directory -Force -Path "$ReleaseDir\scripts\windows" | Out-Null
          Copy-Item "dist\cx2cc.exe" $ReleaseDir
          Copy-Item ".env.example" $ReleaseDir
          Copy-Item "README.md" $ReleaseDir
          Copy-Item "README.zh-CN.md" $ReleaseDir
          Copy-Item "LICENSE" $ReleaseDir
          Copy-Item "run.bat" $ReleaseDir
          Copy-Item "start-cx2cc.bat" $ReleaseDir
          Copy-Item "scripts\windows\start-cx2cc.ps1" "$ReleaseDir\scripts\windows"
          Copy-Item "scripts\windows\run-silent.bat" "$ReleaseDir\scripts\windows"
          Copy-Item "scripts\windows\install-startup.ps1" "$ReleaseDir\scripts\windows"
          Copy-Item "scripts\windows\uninstall-startup.ps1" "$ReleaseDir\scripts\windows"
          Compress-Archive -Path $ReleaseDir -DestinationPath "dist\$ReleaseName.zip" -Force
          $hash = Get-FileHash "dist\$ReleaseName.zip" -Algorithm SHA256
          "$($hash.Hash)  $ReleaseName.zip" | Set-Content -Path "dist\$ReleaseName.zip.sha256" -Encoding ASCII
          Write-Host "SHA256 $($hash.Hash)"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: cx2cc-windows-x64
          path: |
            dist/cx2cc-windows-x64.zip
            dist/cx2cc-windows-x64.zip.sha256

      - name: Create / update release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/cx2cc-windows-x64.zip
            dist/cx2cc-windows-x64.zip.sha256
